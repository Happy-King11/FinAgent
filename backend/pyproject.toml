[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.7", "PyJWT>=2.9", "sqlalchemy>=2.0", "psycopg[binary]>=3.2", "redis>=5.0", "python-dotenv>=1.0", "celery>=5.4", "packaging>=24", "boto3>=1.35", "prometheus-client>=0.21", "PyYAML>=6.0", "httpx>=0.27", "qdrant-client>=1.12,<2"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
